name: Release and publish ssh05
on:
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-and-publish:
    name: Release and publish ssh05
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ssh05
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --clean --skip=publish
      - name: Show Checksum
        run: |
          sha256sum dist/*.tar.gz dist/*.zip dist/*.rpm dist/*.deb dist/*_checksums.txt
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rpm
            dist/*.deb
            dist/*_checksums.txt
  release-win7-patch:
    name: Build win7 release with go1.25 patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ssh05
        uses: actions/checkout@v6
      - name: Set up Go
        run: |
          wget -q https://github.com/thongtech/go-legacy-win7/releases/download/v1.25.7-1/go-legacy-win7-1.25.7-1.linux_amd64.tar.gz -O /tmp/go.tar.gz
          tar -C $HOME -xzf /tmp/go.tar.gz
      - name: Build ssh05
        run: |
          export GOROOT=$HOME/go-legacy-win7
          export GOPATH=$HOME/go
          export PATH=$GOROOT/bin:$GOPATH/bin:$PATH
          which go
          go version
          version=${GITHUB_REF/refs\/tags\/v/}
          GOOS=windows GOARCH=386 go build -ldflags "-s -w" -o ssh05_${version}_win7_i386/ ./cmd/ssh05/
          zip -r ssh05_${version}_win7_i386.zip ssh05_${version}_win7_i386
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o ssh05_${version}_win7_x86_64/ ./cmd/ssh05/
          zip -r ssh05_${version}_win7_x86_64.zip ssh05_${version}_win7_x86_64
      - name: Show Checksum
        run: |
          sha256sum ./*.zip
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.zip
